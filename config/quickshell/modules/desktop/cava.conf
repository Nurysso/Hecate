# Raw bar levels for the desktop audio widget (modules/desktop/widgets/Audio.qml)
[general]
bars = 36
framerate = 30

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
