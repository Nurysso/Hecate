# Mirrors kitty.conf (font, colors, padding, keybinds). Run `termkeys` to list keybinds.

term=xterm-256color
title=foot

# Font
font=JetBrainsMono Nerd Font:style=Bold:size=14
font-bold=JetBrainsMono Nerd Font:style=ExtraBold:size=14
font-italic=JetBrainsMono Nerd Font:style=Italic:size=14
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=14
dpi-aware=no
pad=8x8 center
initial-window-size-chars=120x32
bold-text-in-bright=no

[scrollback]
lines=10000
multiplier=5
indicator-position=fixed

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[bell]
urgent=yes

# Tokyo Night inspired, same as kitty
[colors]
alpha=0.9
foreground=dddddd
background=000000
cursor=1a1b26 c0caf5
urls=7dcfff
selection-foreground=000000
selection-background=7aa2f7

regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

[key-bindings]
# ─── Clipboard ──────────────────────────────────────────────────
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Control+Shift+s Shift+Insert

# ─── Scrolling ──────────────────────────────────────────────────
scrollback-up-line=Control+Shift+Up Shift+Up
scrollback-down-line=Control+Shift+Down Shift+Down
scrollback-up-page=Control+Shift+Page_Up Shift+Page_Up
scrollback-down-page=Control+Shift+Page_Down Shift+Page_Down
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End
search-start=Control+Shift+f

# ─── Font Size ──────────────────────────────────────────────────
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

# ─── Window Management ──────────────────────────────────────────
spawn-terminal=Control+Shift+Return Control+Shift+n

# ─── Misc ───────────────────────────────────────────────────────
unicode-input=Control+Mod1+q Control+Shift+u
show-urls-launch=Control+Shift+o

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+g
delete-prev-word=Control+BackSpace
