# Hecate Dotfiles Configuration
# This file manages your Hecate installation settings

[metadata]
version = "0.3.9 blind owl"
install_date = "2025-10-15"
last_update = "2025-10-15"
repo_url = "https://github.com/Nurysso/Hecate.git"

[theme]
# Theme mode: "dynamic" or "static"
# dynamic: Automatically updates system colors when wallpaper changes
# static: Keeps colors unchanged regardless of wallpaper
mode = "dynamic"
# Shell text font (icons use Symbols Nerd Font)
font = "Inter"

[preferences]
term = "kitty"
browser = "firefox"
shell = "fish"
profile = "minimal"

# Quickshell: see config/quickshell/README.md

[wallpaper]
dir = "~/Pictures/Wallpapers"

[bar]
left = ["launcher", "workspaces", "windows"]
center = ["clock"]
right = [
    "media",
    "stats",
    "volume",
    "battery",
    "tray",
    "connectivity",
    "caffeine",
    "notifications",
    "clipboard",
    "wallpaper",
    "power",
]

# Per-widget overrides: color/background take an M3 token name or any color
[widgets.clock]
format = "ddd d MMM  ·  hh:mm"

[widgets.power]
color = "error"

# Any bar widget also takes right_click = "command"
[widgets.windows]
scope = "workspace"   # "workspace", "monitor" or "all"
titles = "active"     # "none", "active" or "all" (hovered always shows)
max_title = 24

[widgets.stats]
show = ["cpu", "mem", "temp"]   # any of cpu, mem, gpu, temp
right_click = "kitty -e btop"

[widgets.volume]
step = 5              # % per scroll notch
max = 100             # cap, up to 150
right_click = "pavucontrol"

[widgets.media]
max_title = 32

# Desktop widgets: see config/quickshell/README.md
[desktop]
left = ["clock", "weather", "audio"]
right = ["system", "github", "apps"]

[desktop.weather]
location = ""        # city name; empty = guess from your IP
units = "metric"     # or "imperial"

[desktop.github]
user = "Nurysso"     # token is read from ~/.config/tokens/gpat.txt

[desktop.apps]
apps = ["firefox", "kitty", "org.gnome.Nautilus"]   # desktop entry names or shell commands
