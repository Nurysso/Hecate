# ────────────────────────────────────────────────────────────────
# 🌟 Starship Prompt Configuration
# Generated: 2025-11-11 19:17:24
# Modern, clean prompt — Hecate Theme Edition
# colors added by ~/.config/hecate/scripts/update_hecate_colors.sh
# ────────────────────────────────────────────────────────────────

"$schema" = 'https://starship.rs/config-schema.json'

# Add a blank line between prompts for readability
add_newline = true

# Reduce lag for modules
command_timeout = 500

# Main prompt layout
format = """
(bold #5D615F)$username $directory $git_branch $git_status $cmd_duration$fill
(bold #5D615F)$character
"""

# ─── PROMPT SYMBOLS ─────────────────────────────────────────────
[character]
success_symbol = "[ ](bold #738B8E)"
error_symbol = "[  ](bold #35484F)"

# ─── USER & HOST ────────────────────────────────────────────────

[username]
style_user = "bold #6E7D7F"
style_root = "bold #35484F"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname](bold #BB5045) "
disabled = false

# ─── DIRECTORY ──────────────────────────────────────────────────

[directory]
home_symbol = ""
read_only = ""
style = "bg:#738B8E fg:#000000"
truncation_length = 3
truncation_symbol = " ••/"
format = '[](bold fg:#738B8E)[󰉋 $path]($style)[](bold fg:#738B8E)'

# ─── GIT ────────────────────────────────────────────────────────

[git_branch]
symbol = "󰘬 "
format = "on [$symbol$branch]($style) "
style = "bold #C08E70"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold #35484F"
conflicted = "🏳 "
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
untracked = "?${count} "
stashed = "💾${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ─── LANGUAGES ──────────────────────────────────────────────────

[nodejs]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold #5D615F"

[python]
symbol = " "
style = "bold #6E7D7F"

[rust]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold #35484F"

[java]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold #35484F"

[package]
symbol = " "
format = "[$symbol$version]($style)"
style = "bold #BB5045"

[golang]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold #738B8E"

[lua]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold #BB5045"

# ─── MISC MODULES ───────────────────────────────────────────────

[cmd_duration]
min_time = 500
format = "[took $duration](bold #6E7D7F) "

[time]
disabled = false
format = "[$time](dim #8a8987)"
time_format = "%R"  # 24h format

[fill]
symbol = " "

# ─── BATTERY / OS / EXTRAS ──────────────────────────────────────

[battery]
disabled = false
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"
format = "[$symbol $percentage]($style) "

[[battery.display]]
threshold = 10
style = "bold #35484F"

[[battery.display]]
threshold = 30
style = "bold #6E7D7F"

[[battery.display]]
threshold = 100
style = "bold #5D615F"

[os]
disabled = false
format = "[$symbol]($style)"
style = "dim #c6c5c2"

[os.symbols]
Arch = " "
Ubuntu = " "
Debian = " "
Fedora = " "
Manjaro = " "
NixOS = " "
Pop = " "
Raspbian = " "


# ─── DOCKER / KUBERNETES ────────────────────────────────────────

[docker_context]
symbol = " "
format = "via [$symbol$context](bold #BB5045) "

[kubernetes]
symbol = "☸ "
format = 'on [$symbol$context( \($namespace\))](bold #BB5045) '
disabled = false

# ─── CLOUD PROVIDERS ────────────────────────────────────────────

[aws]
symbol = " "
format = 'on [$symbol($profile )($region )](bold #6E7D7F) '

[gcloud]
format = 'on [$symbol$account(@$domain)($region)](bold #BB5045) '

[azure]
symbol = " "
format = 'on [$symbol($subscription)](bold #BB5045) '

# ─── END OF FILE ────────────────────────────────────────────────
