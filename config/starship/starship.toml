# ═══════════════════════════════════════════════════════════════
# Starship config - Hecate
# Edit freely. Only the [palettes.hecate] block at the bottom is rewritten,
# from the wallpaper colors, by ~/.config/hecate/scripts/set-wallpaper.sh.
# ═══════════════════════════════════════════════════════════════

"$schema" = 'https://starship.rs/config-schema.json'
palette = "hecate"

# Performance
command_timeout = 500
scan_timeout = 30
add_newline = true

# Prompt format - clean stylish layout (no boxes!)
format = """
$username\
$hostname\
$os\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$lua\
$c\
$php\
$ruby\
$docker_context\
$package\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

# ─── RIGHT SIDE FILLER ──────────────────────────────────────────
[fill]
symbol = " "

# ─── PROMPT CHARACTER ───────────────────────────────────────────
[character]
success_symbol = "[❯](bold primary)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold tertiary)"

# ─── OS ICON ────────────────────────────────────────────────────
[os]
disabled = false
style = "bold tertiary"
format = "[$symbol]($style)"

[os.symbols]
Arch = ""
Ubuntu = ""
Debian = ""
Fedora = ""
Manjaro = ""
NixOS = ""
Pop = ""
Raspbian = ""

# ─── DIRECTORY ──────────────────────────────────────────────────
[directory]
home_symbol = "~"
read_only = " 󰌾"
style = "bold primary"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only_style = "bold error"
format = '[󰉋 $path]($style)[$read_only]($read_only_style)[](primary) '

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = " "
"Projects" = "󰲋 "
"Code" = " "

# ─── GIT ────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold tertiary"
format = "[$symbol$branch]($style) "
truncation_length = 20

[git_status]
style = "bold tertiary"
format = '[$all_status$ahead_behind]($style) '
conflicted = "󰞇"
ahead = "⇡${count}"
diverged = "⇕${ahead_count}${behind_count}"
behind = "⇣${count}"
untracked = "?${count}"
stashed = "󰏖${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
disabled = false

ignore_submodules = true

# ─── LANGUAGE MODULES ───────────────────────────────────────────
[nodejs]
symbol = ""
style = "bold secondary"
format = "[$symbol $version]($style) "
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

[python]
symbol = ""
style = "bold secondary"
format = "[$symbol $version( \\($virtualenv\\))]($style) "
detect_extensions = ["py"]
detect_files = [".python-version", "pyproject.toml", "requirements.txt"]

[rust]
symbol = ""
style = "bold secondary"
format = "[$symbol $version]($style) "
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[golang]
symbol = ""
style = "bold secondary"
format = "[$symbol $version]($style) "
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

[java]
symbol = ""
style = "bold secondary"
format = "[$symbol $version]($style) "
detect_extensions = ["java", "class", "jar"]

[lua]
symbol = ""
style = "bold secondary"
format = "[$symbol $version]($style) "
detect_extensions = ["lua"]

[package]
symbol = "󰏗"
style = "bold secondary"
format = "[$symbol $version]($style) "
display_private = false

# ─── COMMAND DURATION ───────────────────────────────────────────
[cmd_duration]
min_time = 1000
style = "bold muted"
format = "[$duration]($style) "
show_milliseconds = false

# ─── TIME ───────────────────────────────────────────────────────
[time]
disabled = false
style = "bold muted"
format = "[$time]($style)"
time_format = "%R"
use_12hr = false

# ─── CONTAINERS ─────────────────────────────────────────────────
[docker_context]
symbol = ""
style = "bold tertiary"
format = "[$symbol $context]($style) "
only_with_files = true
detect_files = ["docker-compose.yml", "Dockerfile"]

# ─── ADDITIONAL LANGUAGES ───────────────────────────────────────
[c]
symbol = ""
style = "bold secondary"
format = "[$symbol $version]($style) "
disabled = false

[php]
symbol = ""
style = "bold secondary"
format = "[$symbol $version]($style) "
disabled = false

[ruby]
symbol = ""
style = "bold secondary"
format = "[$symbol $version]($style) "
disabled = false

# ─── USER & HOST (SSH / root only) ─────────────────────────────
[username]
disabled = false
style_user = "bold secondary"
style_root = "bold error"
format = "[$user]($style) "
show_always = false

[hostname]
disabled = false
ssh_only = true
style = "bold tertiary"
format = "[@$hostname]($style) "

# ─── PALETTE ────────────────────────────────────────────────────
# Keep this block last: set-wallpaper.sh replaces everything from here down
# with the matugen colors. Defaults match the terminals (Tokyo Night).
[palettes.hecate]
primary = "#7aa2f7"
secondary = "#bb9af7"
tertiary = "#7dcfff"
error = "#f7768e"
muted = "#565f89"
