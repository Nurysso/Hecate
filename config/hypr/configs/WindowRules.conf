# 🚀 WINDOW RULES CONFIGURATION
# -----------------------------------------
# 📚 Wiki: https://wiki.hypr.land/Configuring/Window-Rules/
#
# 💡 Quick Tips:
#    - Control window behavior and attributes.
#    - Syntax: windowrule=RULE,PARAMETERS
#    - Example: `windowrule = float, ^(pavucontrol)$`
# -----------------------------------------

#windowrule = opacity $windowOpacity override, match:fullscreen false

windowrule = opaque true, match:class foot|equibop|org\.quickshell|imv|swappy # They use native transparency or we want them opaque
windowrule = center true, match:float true, match:xwayland false # Center all floating windows (not xwayland cause popups)

windowrule = float true, match:class guifetch
windowrule = float true, match:class yad
windowrule = float true, match:class org\.gnome\.FileRoller
windowrule = float true, match:class file-roller
windowrule = float true, match:class blueman-manager
windowrule = float true, match:class com\.github\.GradienceTeam\.Gradience
windowrule = float true, match:class feh
windowrule = float true, match:class imv
windowrule = float true, match:class system-config-printer
windowrule = float true, match:class org\.quickshell
windowrule = float true, match:class com\.obsproject\.Studio, workspace special, size 70% 80%

windowrule = float true, match:class foot, match:title nmtui
windowrule = size 60% 70%, match:class foot, match:title nmtui
windowrule = center 1, match:class foot, match:title nmtui
windowrule = float true, match:title Library
windowrule = float true, match:class nm-connection-editor
windowrule = float true, match:class org\.gnome\.Settings
windowrule = size 70% 80%, match:class org\.gnome\.Settings
windowrule = center 1, match:class org\.gnome\.Settings
windowrule = float true, match:class org\.pulseaudio\.pavucontrol|yad-icon-browser|waypaper
windowrule = size 80% 70%, match:class org\.pulseaudio\.pavucontrol|yad-icon-browser|waypaper
windowrule = center 1, match:class org\.pulseaudio\.pavucontrol|yad-icon-browser|waypaper
windowrule = float true, match:class nwg-look
windowrule = size 50% 60%, match:class nwg-look
windowrule = center 1, match:class nwg-look
windowrule = float true, match:class hyprsettings
windowrule = float true, match:class xdg-desktop-portal-gtk
windowrule = float true, match:class Hera
# Dialogs
windowrule = float true, match:title (Select|Open)( a)? (File|Folder)(s)?
windowrule = float true, match:title File (Operation|Upload)( Progress)?
windowrule = float true, match:class ^firefox$, match:title ^Opening .*$
windowrule = float true, match:title nmtui
windowrule = float true, match:title .* Properties
windowrule = float true, match:title Export Image as PNG
windowrule = float true, match:title GIMP Crash Debug
windowrule = float true, match:title Save As
windowrule = float true, match:title Library

# windowrule = float true, match:class nm-connection-editor, border_size 0, match:float true, center true, size 923 573

workspace = w[tv1]s[false], gapsout:10
workspace = f[1]s[false], gapsout:10

# ######## Layer rules ########
layerrule = animation fade, match:namespace hyprpicker # Colour picker out animation
layerrule = animation fade, match:namespace logout_dialog # wlogout
layerrule = animation fade, match:namespace selection # slurp
layerrule = animation fade, match:namespace wayfreeze

# Fuzzel
layerrule = animation popin 80%, match:namespace launcher
layerrule = blur true, match:namespace launcher


windowrule {
  name = windowrule-7
  float = on
  match:title = ^(System Monitor)$
}

# Picture-in-Picture special behavior
windowrule {
  name = windowrule-8
  float = on
  pin = on
  move = ((monitor_w*0.695)) ((monitor_h*0.04))
  match:title = ^(Picture-in-Picture)$
}

windowrule {
  name = windowrule-9
  center = on
  border_size = 0
  match:title = ^(update-window)$
}

windowrule {
  name = windowrule-10
  float = on
  size = 900 600
  match:class = ^(dotfiles-floating)$
}

windowrule {
  name = windowrule-11
  border_size = 0
  no_shadow = on
  match:title = ^(Firefox)$
}


#windowrulev2 = float, class:^(dropdown)$
#windowrulev2 = workspace special silent, class:^(dropdown)$

# System Visualizer Widget Rules
windowrule {
  name = windowrule-15
  float = on
  border_size = 0
  no_blur = on
  match:class = ^(Pulse)$
}

#windowrulev2 = pin, class:^(Pulse)$
windowrule {
  name = windowrule-16
  float = on
  border_size = 0
  no_blur = on
  match:class = ^(Hecate-Settings)$
}



# Window rules for Aoiler
windowrule {
  name = windowrule-17
  workspace = special:aoiler
  float = on
  size = (monitor_w*0.2) (monitor_h*0.95)
  move = (10) (40)
  match:class = (Aoiler)
}

windowrule {
  name = windowrule-18
  float = on
  match:initial_class = ^(shotcut)$
  match:initial_title = ^(Projects Folder)$
}
