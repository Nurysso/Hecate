# ═══════════════════════════════════════════════════════════════
# Kitty Terminal - Optimized for Performance & Aesthetics
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# Font Configuration
# ───────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Bold
bold_font        JetBrainsMono Nerd Font Extra Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 14.0

# Better font rendering
disable_ligatures never
font_features none

# ───────────────────────────────────────────────────────────────
# Cursor Configuration
# ───────────────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0
cursor_trail 1
cursor_trail_decay 0.1 0.4

# ───────────────────────────────────────────────────────────────
# Performance Optimizations
# ───────────────────────────────────────────────────────────────
# Rendering optimizations
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0
scrollback_fill_enlarged_window no
wheel_scroll_multiplier 5.0
wheel_scroll_min_lines 1

# ───────────────────────────────────────────────────────────────
# Window & Layout
# ───────────────────────────────────────────────────────────────
remember_window_size  yes
initial_window_width  1200
initial_window_height 700
window_padding_width 8
window_margin_width 0
single_window_margin_width -1
placement_strategy center

# Window decorations
hide_window_decorations no
window_border_width 1pt
draw_minimal_borders yes
active_border_color #7aa2f7
inactive_border_color #292e42

# Confirm close only when multiple windows/tabs
confirm_os_window_close 0

# ───────────────────────────────────────────────────────────────
# Tab Bar Configuration
# ───────────────────────────────────────────────────────────────
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_activity_symbol 󰄭
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{title}"

# Tab bar colors
# active_tab_foreground   #000000
# active_tab_background   #7aa2f7
# active_tab_font_style   bold
# inactive_tab_foreground #c0caf5
# inactive_tab_background #292e42
# inactive_tab_font_style normal

# ───────────────────────────────────────────────────────────────
# Display Server & Graphics
# ───────────────────────────────────────────────────────────────
linux_display_server wayland
wayland_titlebar_color system

# ───────────────────────────────────────────────────────────────
# Background & Opacity
# ───────────────────────────────────────────────────────────────
background_opacity 0.9
dynamic_background_opacity 1
background_blur 1

# ───────────────────────────────────────────────────────────────
# Color Scheme (Tokyo Night inspired)
# ───────────────────────────────────────────────────────────────
foreground #dddddd
background #000000
# selection_foreground #000000
# selection_background #7aa2f7

cursor #c0caf5
cursor_text_color #1a1b26

# URL colors
url_color #7dcfff
url_style curly

# Black
color0 #15161e
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5

# Extended colors for better compatibility
color16 #ff9e64
color17 #db4b4b

# ───────────────────────────────────────────────────────────────
# Bell & Notifications
# ───────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "󰂚 "
command_on_bell none

# ───────────────────────────────────────────────────────────────
# Mouse Configuration
# ───────────────────────────────────────────────────────────────
mouse_hide_wait 3.0
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
show_hyperlink_targets yes
underline_hyperlinks hover

# Copy on select
copy_on_select yes
strip_trailing_spaces smart

# Mouse actions
mouse_map left click ungrabbed mouse_handle_click selection link prompt
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link

# ───────────────────────────────────────────────────────────────
# Advanced Performance Settings
# ───────────────────────────────────────────────────────────────
# Update check (disable for faster startup)
# update_check_interval 0

# Shell integration
shell_integration enabled

# Close window without confirmation when running specific programs
close_on_child_death no

# ───────────────────────────────────────────────────────────────
# Keyboard Shortcuts
# ───────────────────────────────────────────────────────────────

# Clear default shortcuts for cleaner config
clear_all_shortcuts no

# ─── Clipboard ──────────────────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection

# ─── Scrolling ──────────────────────────────────────────────────
map ctrl+shift+up    scroll_line_up
map ctrl+shift+down  scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end  scroll_end

# ─── Font Size ──────────────────────────────────────────────────
map ctrl+equal  change_font_size all +1.0
map ctrl+plus   change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# ─── Window Management ──────────────────────────────────────────
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+w     close_window
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window
map ctrl+shift+f     move_window_forward
map ctrl+shift+b     move_window_backward
map ctrl+shift+`     move_window_to_top

# ─── Tab Management ─────────────────────────────────────────────
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+q     close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+.     move_tab_forward
map ctrl+shift+,     move_tab_backward
# map ctrl+shift+alt+t set_tab_title
map ctrl+shift+d set_tab_title

# Jump to specific tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5

# ─── Layout Management ──────────────────────────────────────────
map ctrl+shift+a next_layout

# ─── Misc ───────────────────────────────────────────────────────
map ctrl+shift+f11   toggle_fullscreen
map ctrl+alt+q     kitten unicode_input
map ctrl+shift+f2    edit_config_file
map ctrl+shift+escape kitty_shell window
map ctrl+shift+delete clear_terminal reset active

# ───────────────────────────────────────────────────────────────
# OS-Specific Settings
# ───────────────────────────────────────────────────────────────
# Wayland-specific optimizations
# wayland_enable_ime no

# ───────────────────────────────────────────────────────────────
# Allow Remote Control (for kitty extensions)
# ───────────────────────────────────────────────────────────────
# allow_remote_control yes
# listen_on unix:@mykitty

# ───────────────────────────────────────────────────────────────
# Performance Tips
# ───────────────────────────────────────────────────────────────
# - repaint_delay 10 & input_delay 3 = faster response
# - sync_to_monitor = smooth rendering
# - scrollback_lines 10000 instead of 5000 = better history without lag
# - background_blur 1 = subtle blur effect (disable if you want max performance)
# - update_check_interval 0 = faster startup
