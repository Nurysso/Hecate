[General]
# Password mask character
passwordCharacter=❃
# Mask password characters or not ("true" or "false")
passwordMask=true
# value "1" is all display width, "0.5" is a half of display width etc.
passwordInputWidth=0.5
# Background color of password input
passwordInputBackground=
# Radius of password input corners
passwordInputRadius=0
# "true" for visible cursor, "false"
passwordInputCursorVisible=true
# Font size of password (in points)
passwordFontSize=96
passwordCursorColor=random
passwordTextColor=
# Allow blank password (e.g., if authentication is done by another PAM module)
passwordAllowEmpty=false

# Enable or disable cursor blink animation ("true" or "false")
cursorBlinkAnimation=true

# Show or not sessions choose label
showSessionsByDefault=true
# Font size of sessions choose label (in points).
sessionsFontSize=24

# Show or not users choose label
showUsersByDefault=false
# Font size of users choose label (in points)
usersFontSize=48
# Show user real name on label by default
showUserRealNameByDefault=true

# Path to background image
background=backgrounds/earthSpaceBlur.jpg
# Or use just one color
#backgroundFill=#000000
backgroundMode=aspect

# Default text color for all labels
basicTextColor=#ffffff

# Blur radius for background image (0 = off, use a pre-blurred image)
blurRadius=0

# Hide cursor
hideCursor=false

# Default font
font=monospace

# Font of help message
helpFont=monospace
# Font size of help message (in points)
helpFontSize=18

# ---------------------------------------------------------------
# Login fade
# ---------------------------------------------------------------
# Set to false to turn the fade off completely
fadeEnabled=true
# Time to fade out after pressing Enter (ms, 0 = instant)
fadeDuration=150
# Extra time to hold on the faded screen before logging in (ms)
fadeHold=0
# Fade in from the fade color when the greeter starts (ms, 0 = off)
introFadeDuration=0
# Color to fade to; match Hyprland's misc.background_color
fadeColor=#000000
# linear | in | out | inout
fadeEasing=out

# ---------------------------------------------------------------
# Wrong password feedback
# ---------------------------------------------------------------
errorBorderColor=#ff3117
# Base width in px; it pulses up to double this
errorBorderWidth=5
